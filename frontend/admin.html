<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - NextGen Digital Academy</title>
<link rel="stylesheet" href="css/admin-style.css">
</head>
<body>
<div class="admin-container">
  <h1>Admin Dashboard</h1>

  <!-- Analytics -->
  <div class="analytics">
    <div>Total Courses: <span id="totalCourses">0</span></div>
    <div>Total Leads: <span id="totalLeads">0</span></div>
    <div>Estimated Revenue: $<span id="totalRevenue">0</span></div>
  </div>

  <!-- Course CRUD -->
  <div class="course-crud">
    <h2>Add New Course</h2>
    <form id="courseForm">
      <input type="text" id="courseTitle" placeholder="Title" required />
      <input type="text" id="courseCategory" placeholder="Category" required />
      <input type="number" id="coursePrice" placeholder="Price" required />
      <input type="text" id="courseImage" placeholder="Image URL" required />
      <textarea id="courseSyllabus" placeholder="Week 1:..., Week 2:..., etc." required></textarea>
      <button type="submit">Add Course</button>
    </form>
    <div id="courseList"></div>
  </div>

  <!-- Enrollment Logs -->
  <div class="enrollments">
    <h2>Enrollment Tracker</h2>
    <table id="enrollTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Course</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button id="exportCSV">Export CSV</button>
  </div>
</div>
<script src="js/admin.js"></script>
</body>
</html>
