<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen Digital Academy | Admin Dashboard</title>
  <link rel="stylesheet" href="admin-style.css">
</head>
<body>
  <header class="admin-header">
    <h1>NextGen Digital Academy - Admin Dashboard</h1>
  </header>

  <main class="admin-main container">

    <!-- ANALYTICS ROW -->
    <section class="analytics-row">
      <div class="analytics-card">
        <h3>Total Courses</h3>
        <p id="totalCourses">0</p>
      </div>
      <div class="analytics-card">
        <h3>Total Leads</h3>
        <p id="totalLeads">0</p>
      </div>
      <div class="analytics-card">
        <h3>Projected Revenue ($)</h3>
        <p id="projectedRevenue">0</p>
      </div>
    </section>

    <!-- COURSE CRUD -->
    <section class="course-crud">
      <h2>Add New Course</h2>
      <form id="courseForm">
        <label>Title: <input type="text" id="courseTitle" required></label>
        <label>Price: <input type="number" id="coursePrice" required></label>
        <label>Category: 
          <select id="courseCategory">
            <option>Psychology</option>
            <option>Freelancing</option>
            <option>Marketing</option>
            <option>Video Editing</option>
            <option>Business</option>
          </select>
        </label>
        <label>Instructor: <input type="text" id="courseInstructor" required></label>
        <label>Image URL: <input type="url" id="courseImage" required></label>
        <fieldset>
          <legend>Syllabus Creator</legend>
          <label>Week 1: <input type="text" id="syllabusWeek1" required></label>
          <label>Week 2: <input type="text" id="syllabusWeek2" required></label>
          <label>Week 3: <input type="text" id="syllabusWeek3" required></label>
          <label>Week 4: <input type="text" id="syllabusWeek4" required></label>
        </fieldset>
        <button type="submit">Add Course</button>
      </form>
    </section>

    <!-- LEAD MANAGEMENT -->
    <section class="lead-management">
      <h2>Student Leads</h2>
      <button id="downloadCSV">Download CSV</button>
      <table id="leadsTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <!-- Dynamic Leads Rows -->
        </tbody>
      </table>
    </section>

  </main>

  <script src="admin.js"></script>
</body>
</html>
