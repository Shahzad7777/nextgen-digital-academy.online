<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextGen Digital Academy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Onboarding Survey -->
<div id="onboarding" class="onboarding-container">
  <h2>Welcome to NextGen Digital Academy</h2>
  <form id="surveyForm">
    <div class="survey-step">
      <label>What is your main goal?</label>
      <select required>
        <option>Freelancing</option>
        <option>Digital Marketing</option>
        <option>Video Editing</option>
        <option>Programming</option>
        <option>Graphic Design</option>
        <option>Other</option>
      </select>
    </div>
    <div class="survey-step">
      <label>Preferred Learning Style?</label>
      <select required>
        <option>Videos</option>
        <option>Articles</option>
        <option>Interactive Labs</option>
      </select>
    </div>
    <div class="survey-step">
      <label>Time Commitment per Week?</label>
      <select required>
        <option>1-2 hours</option>
        <option>3-5 hours</option>
        <option>5+ hours</option>
      </select>
    </div>
    <div class="survey-step">
      <label>Skill Level?</label>
      <select required>
        <option>Beginner</option>
        <option>Intermediate</option>
        <option>Advanced</option>
      </select>
    </div>
    <div class="survey-step">
      <label>Preferred Device?</label>
      <select required>
        <option>Laptop</option>
        <option>Tablet</option>
        <option>Mobile</option>
      </select>
    </div>
    <div class="survey-step">
      <label>Interested Categories?</label>
      <select required multiple>
        <option>Freelancing</option>
        <option>Marketing</option>
        <option>Video</option>
        <option>Programming</option>
        <option>Design</option>
      </select>
    </div>
    <button type="submit">Start Learning</button>
  </form>
</div>

<!-- Main Content -->
<div id="mainContent" class="hidden">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="brand">NextGen Digital Academy</div>
    <input type="text" id="searchBar" placeholder="Search courses..." />
  </nav>

  <!-- Category Tabs -->
  <div class="tabs">
    <button class="tab active" data-category="All">All</button>
    <button class="tab" data-category="Freelancing">Freelancing</button>
    <button class="tab" data-category="Marketing">Marketing</button>
    <button class="tab" data-category="Video">Video</button>
    <button class="tab" data-category="Programming">Programming</button>
    <button class="tab" data-category="Design">Design</button>
  </div>

  <!-- Course Grid -->
  <div id="courseGrid" class="course-grid"></div>
</div>

<!-- Checkout Modal -->
<div id="checkoutModal" class="modal hidden">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>Checkout</h2>
    <form id="checkoutForm">
      <input type="text" id="leadName" placeholder="Your Name" required />
      <input type="email" id="leadEmail" placeholder="Your Email" required />
      <select id="paymentMethod" required>
        <option value="">Select Payment</option>
        <option>JazzCash</option>
        <option>EasyPaisa</option>
        <option>Meezan Bank</option>
      </select>
      <button type="submit">Pay & Enroll</button>
    </form>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
